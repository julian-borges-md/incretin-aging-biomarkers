<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="940" viewBox="0 0 1040 940" role="img" aria-label="PRISMA 2020 flow diagram for the incretin aging biomarker review">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8a8a"/></marker></defs>
<rect width="1040" height="940" fill="#ffffff"/>
<text x="40" y="30" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#1a1a1a">PRISMA 2020 flow of records through the review</text>
<text x="18" y="150" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#5c5c5c" letter-spacing="1.1" transform="rotate(-90 18 150)">IDENTIFICATION</text>
<rect x="40" y="54" width="430" height="145" rx="3" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2"/>
<text x="54" y="74" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1a1a1a">Records identified from our own searching (n = 1009)</text>
<text x="54" y="91" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5c5c5c">Embase, 15 Oct 2026: 710 hits, 659 article records and 51</text>
<text x="54" y="106" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5c5c5c">registry records exported</text>
<text x="54" y="121" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5c5c5c">CENTRAL, 15 Oct 2026: 460 exported, 200 not already in Embase</text>
<text x="54" y="136" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5c5c5c">Web of Science, 16 Oct 2026: 317 exported, 99 in neither other</text>
<text x="54" y="151" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5c5c5c">database</text>
<text x="54" y="166" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5c5c5c">PubMed anchor searches for the dual and triple agonists: 156,</text>
<text x="54" y="181" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5c5c5c">95 and 13 PMIDs</text>
<rect x="560" y="54" width="420" height="145" rx="3" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="574" y="74" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1a1a1a">Separate inflow, not from our searching</text>
<text x="574" y="91" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5c5c5c">Mono agonist comparator trials adopted from two published</text>
<text x="574" y="106" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5c5c5c">systematic reviews: Alrasheed 2026, 40 RCTs; Ren 2025, 52</text>
<text x="574" y="121" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5c5c5c">RCTs.</text>
<text x="574" y="136" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5c5c5c">Their screening was performed by other groups and is</text>
<text x="574" y="151" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5c5c5c">inherited, so these records do not pass through the stages</text>
<text x="574" y="166" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5c5c5c">below. Re-screened against this review's criteria at</text>
<text x="574" y="181" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5c5c5c">extraction.</text>
<line x1="255.0" y1="199" x2="255.0" y2="225" stroke="#8a8a8a" stroke-width="1.2" marker-end="url(#a)"/>
<text x="18" y="299" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#5c5c5c" letter-spacing="1.1" transform="rotate(-90 18 299)">SCREENING</text>
<rect x="40" y="229" width="430" height="115" rx="3" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2"/>
<text x="54" y="249" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1a1a1a">Records screened, title and abstract (n = 1009)</text>
<text x="54" y="266" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5c5c5c">Three pools screened on different days by two independent</text>
<text x="54" y="281" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5c5c5c">reviewers with a third adjudicating: pool 1, the 659 Embase</text>
<text x="54" y="296" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5c5c5c">articles; pool 2, 251 registry and CENTRAL only records; pool</text>
<text x="54" y="311" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5c5c5c">3, 99 Web of Science records.</text>
<text x="54" y="326" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5c5c5c">Cohen kappa 0.649 (pool 1) and 0.556 (pool 2).</text>
<line x1="470" y1="286.5" x2="556" y2="286.5" stroke="#8a8a8a" stroke-width="1.2" marker-end="url(#a)"/>
<rect x="560" y="229" width="420" height="85" rx="3" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2"/>
<text x="574" y="249" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1a1a1a">Records excluded (n = 433)</text>
<text x="574" y="266" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5c5c5c">Pool 1 after the criteria v2 rescreen of its v1 exclusions:</text>
<text x="574" y="281" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5c5c5c">297 (24 of 321 rescued).</text>
<text x="574" y="296" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5c5c5c">Pool 2: 66. Pool 3: 70.</text>
<line x1="255.0" y1="344" x2="255.0" y2="370" stroke="#8a8a8a" stroke-width="1.2" marker-end="url(#a)"/>
<rect x="40" y="374" width="430" height="55" rx="3" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2"/>
<text x="54" y="394" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1a1a1a">Records sought for full text (n = 576)</text>
<text x="54" y="411" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5c5c5c">Pool 1: 362. Pool 2: 185. Pool 3: 29.</text>
<line x1="470" y1="401.5" x2="556" y2="401.5" stroke="#8a8a8a" stroke-width="1.2" marker-end="url(#a)"/>
<rect x="560" y="374" width="420" height="70" rx="3" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2"/>
<text x="574" y="394" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1a1a1a">Not assessed (n = 23)</text>
<text x="574" y="411" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5c5c5c">No text obtainable: 3, listed with reasons.</text>
<text x="574" y="426" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5c5c5c">Already held in the master under another record: 20.</text>
<line x1="255.0" y1="444" x2="255.0" y2="470" stroke="#8a8a8a" stroke-width="1.2" marker-end="url(#a)"/>
<text x="18" y="534" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#5c5c5c" letter-spacing="1.1" transform="rotate(-90 18 534)">ELIGIBILITY</text>
<rect x="40" y="474" width="430" height="100" rx="3" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2"/>
<text x="54" y="494" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1a1a1a">Records assessed at full text (n = 553)</text>
<text x="54" y="511" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5c5c5c">Raw agreement 409 of 556, Cohen kappa 0.16, low because the</text>
<text x="54" y="526" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5c5c5c">marginals are extremely unbalanced and reported as such. All</text>
<text x="54" y="541" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5c5c5c">149 disagreements adjudicated, 51 to include and 98 to</text>
<text x="54" y="556" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5c5c5c">exclude.</text>
<line x1="470" y1="524.0" x2="556" y2="524.0" stroke="#8a8a8a" stroke-width="1.2" marker-end="url(#a)"/>
<rect x="560" y="474" width="420" height="70" rx="3" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2"/>
<text x="574" y="494" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1a1a1a">Records excluded (n = 113)</text>
<text x="574" y="511" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5c5c5c">Design, population, intervention, outcome or timing criterion</text>
<text x="574" y="526" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5c5c5c">not met.</text>
<line x1="255.0" y1="574" x2="255.0" y2="600" stroke="#8a8a8a" stroke-width="1.2" marker-end="url(#a)"/>
<rect x="40" y="604" width="430" height="85" rx="3" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2"/>
<text x="54" y="624" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1a1a1a">Records included, grouped into studies (n = 340)</text>
<text x="54" y="641" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5c5c5c">440 included records grouped by DOI, title and registry</text>
<text x="54" y="656" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5c5c5c">identifier, so one study with a conference abstract, a</text>
<text x="54" y="671" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5c5c5c">register entry and a full text is one group.</text>
<line x1="255.0" y1="689" x2="255.0" y2="715" stroke="#8a8a8a" stroke-width="1.2" marker-end="url(#a)"/>
<text x="18" y="789" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#5c5c5c" letter-spacing="1.1" transform="rotate(-90 18 789)">INCLUDED</text>
<rect x="40" y="719" width="430" height="100" rx="3" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2"/>
<text x="54" y="739" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1a1a1a">Studies contributing to the synthesis (n = 83 groups)</text>
<text x="54" y="756" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5c5c5c">524 contrasts over 76 trials or trial analyses; groups can</text>
<text x="54" y="771" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5c5c5c">share a trial. 486 convertible to the percent change scale, 38</text>
<text x="54" y="786" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5c5c5c">not, for want of a printed baseline denominator. Risk of bias</text>
<text x="54" y="801" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5c5c5c">assessed for 77 records.</text>
<line x1="470" y1="769.0" x2="556" y2="769.0" stroke="#8a8a8a" stroke-width="1.2" marker-end="url(#a)"/>
<rect x="560" y="719" width="420" height="175" rx="3" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2"/>
<text x="574" y="739" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1a1a1a">Studies closed without contributing (n = 257)</text>
<text x="574" y="756" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5c5c5c">No recoverable variance, closed by the deterministic scan:</text>
<text x="574" y="771" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5c5c5c">104.</text>
<text x="574" y="786" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5c5c5c">No recoverable variance on reading: 84.</text>
<text x="574" y="801" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5c5c5c">Eligibility failure visible only at extraction, including</text>
<text x="574" y="816" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5c5c5c">three data integrity refusals: 37.</text>
<text x="574" y="831" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5c5c5c">Molecule outside the admitted classes: 5. Registered without</text>
<text x="574" y="846" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5c5c5c">posted results: 11.</text>
<text x="574" y="861" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5c5c5c">Held for a Director decision on population or co formulation:</text>
<text x="574" y="876" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5c5c5c">16.</text>
<polyline points="980,199 1008,199 1008,916 255.0,916 255.0,825" fill="none" stroke="#8a8a8a" stroke-width="1.2" marker-end="url(#a)" stroke-dasharray="5 4"/>
<text x="267.0" y="909" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#5c5c5c">adopted comparator trials, re-screened at extraction</text>
</svg>